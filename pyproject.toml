[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dovideo-learning"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pymysql>=1.1,<2", "httpx>=0.28,<1", "minio>=7.2,<8", "docling>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
indexing = ["sentence-transformers>=3,<6"]
agent = ["langgraph>=1,<2"]

[tool.setuptools.packages.find]
include = ["agent_service*", "knowledge_service*"]

[tool.pytest.ini_options]
testpaths = ["agent_service/tests", "knowledge_service/tests"]
