# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.learning.yml --profile learning up -d learning-api learning-worker
services:
  learning-api:
    profiles: [learning]
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    image: dovideo-learning:local
    ports: ["127.0.0.1:8091:8091"]
    environment: &learning-env
      LEARNING_DATABASE_URL: ${LEARNING_DATABASE_URL:?Set a mysql+pymysql URL pointing to media_db (mysql:3306 in Docker)}
      LEARNING_SERVICE_TOKEN: ${LEARNING_SERVICE_TOKEN:?Set a random token of at least 32 characters}
      LEARNING_JAVA_URL: ${LEARNING_JAVA_URL:-http://host.docker.internal:9090}
      LEARNING_MINIO_ENDPOINT: minio:9000
      LEARNING_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      LEARNING_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      LEARNING_MINIO_BUCKET: media
      LEARNING_MINIO_SECURE: "false"
      DOCLING_ARTIFACTS_PATH: /models
      LEARNING_EMBEDDING_PROVIDER: local_bge_m3
      LEARNING_EMBEDDING_MODEL_PATH: /models/bge-m3
      LEARNING_EMBEDDING_MODEL_REVISION: ${LEARNING_EMBEDDING_MODEL_REVISION:-pinned-local-revision}
      LEARNING_EMBEDDING_DIMENSION: "1024"
      LEARNING_EMBEDDING_BATCH_SIZE: ${LEARNING_EMBEDDING_BATCH_SIZE:-16}
      LEARNING_EMBEDDING_DEVICE: ${LEARNING_EMBEDDING_DEVICE:-cpu}
      LEARNING_QDRANT_URL: http://qdrant:6333
      LEARNING_QDRANT_COLLECTION: course_knowledge_bge_m3_d1024_v1
      LEARNING_QDRANT_API_KEY: ${LEARNING_QDRANT_API_KEY:-}
      LEARNING_LLM_BASE_URL: ${LEARNING_LLM_BASE_URL:-}
      LEARNING_LLM_API_KEY: ${LEARNING_LLM_API_KEY:-}
      LEARNING_LLM_MODEL: ${LEARNING_LLM_MODEL:-}
      LEARNING_LLM_TIMEOUT_SECONDS: ${LEARNING_LLM_TIMEOUT_SECONDS:-45}
      LEARNING_LLM_MAX_INPUT_TOKENS: ${LEARNING_LLM_MAX_INPUT_TOKENS:-24000}
      LEARNING_LLM_MAX_OUTPUT_TOKENS: ${LEARNING_LLM_MAX_OUTPUT_TOKENS:-1600}
      LEARNING_LLM_TEMPERATURE: ${LEARNING_LLM_TEMPERATURE:-0.2}
      LEARNING_LLM_THINKING: ${LEARNING_LLM_THINKING:-}
    read_only: true
    tmpfs: ["/tmp:size=256m", "/work:size=512m,uid=10001,gid=10001"]
    volumes: ["${DOCLING_ARTIFACTS_PATH:-./.learning-models}:/models:ro"]
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8091/health/ready',headers={'Authorization':'Bearer '+os.environ['LEARNING_SERVICE_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  learning-worker:
    profiles: [learning]
    image: dovideo-learning:local
    command: ["python", "-m", "agent_service.worker"]
    environment: *learning-env
    read_only: true
    tmpfs: ["/tmp:size=512m", "/work:size=1g,uid=10001,gid=10001"]
    volumes: ["${DOCLING_ARTIFACTS_PATH:-./.learning-models}:/models:ro"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      learning-api: {condition: service_healthy}
  learning-agent-worker:
    profiles: [learning]
    image: dovideo-learning:local
    command: ["python", "-m", "agent_service.learning_agent.worker"]
    environment: *learning-env
    read_only: true
    tmpfs: ["/tmp:size=256m", "/work:size=256m,uid=10001,gid=10001"]
    volumes: ["${DOCLING_ARTIFACTS_PATH:-./.learning-models}:/models:ro"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      learning-api: {condition: service_healthy}
      qdrant: {condition: service_started}
